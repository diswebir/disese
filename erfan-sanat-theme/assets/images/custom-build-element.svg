<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="طرح فنی المان نوری سفارشی">
	<defs>
		<linearGradient id="cbBack" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0c1017"/>
			<stop offset="1" stop-color="#05070c"/>
		</linearGradient>
		<radialGradient id="cbGlow" cx="50%" cy="42%" r="52%">
			<stop offset="0" stop-color="#f2b32c" stop-opacity=".38"/>
			<stop offset="1" stop-color="#f2b32c" stop-opacity="0"/>
		</radialGradient>
		<pattern id="cbGrid" width="40" height="40" patternUnits="userSpaceOnUse">
			<path d="M40 0H0v40" fill="none" stroke="#1b2231" stroke-width="1"/>
		</pattern>
		<filter id="cbBlur" x="-40%" y="-40%" width="180%" height="180%">
			<feGaussianBlur stdDeviation="18"/>
		</filter>
	</defs>

	<rect width="800" height="600" fill="url(#cbBack)"/>
	<rect width="800" height="600" fill="url(#cbGrid)" opacity=".55"/>
	<ellipse cx="400" cy="260" rx="280" ry="220" fill="url(#cbGlow)"/>

	<!-- technical drawing of a pendulum light element -->
	<g fill="none" stroke="#ffd980" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
		<path d="M220 110h360"/>
		<path d="M400 110v46"/>
		<path d="M356 156h88l-28 34h-32z" fill="#1a1f2b" stroke-opacity=".9"/>
		<circle cx="400" cy="250" r="60" fill="#241d10"/>
		<circle cx="400" cy="250" r="60" stroke="#f2b32c"/>
		<circle cx="400" cy="250" r="40" stroke-opacity=".45"/>
		<circle cx="400" cy="250" r="18" fill="#ffe6ad" stroke="none" opacity=".9"/>
		<path d="M292 352h216l-34 90H326z" fill="#151a24" stroke="#f2b32c" stroke-opacity=".8"/>
		<path d="M330 442h140" stroke-opacity=".6"/>
		<path d="M352 470h96" stroke-opacity=".4"/>
	</g>

	<!-- glow around the emitter -->
	<circle cx="400" cy="250" r="86" fill="#f2b32c" opacity=".22" filter="url(#cbBlur)"/>

	<!-- dimension lines -->
	<g stroke="#f2b32c" stroke-opacity=".55" stroke-width="2">
		<path d="M220 110v-26h360v26"/>
		<path d="M150 156v304"/>
		<path d="M142 156h16M142 460h16"/>
		<path d="M658 250v220"/>
		<path d="M650 250h16M650 470h16"/>
	</g>

	<!-- corner ticks -->
	<g stroke="#39415a" stroke-width="3" stroke-linecap="round">
		<path d="M48 96V48h48"/>
		<path d="M752 96V48h-48"/>
		<path d="M48 504v48h48"/>
		<path d="M752 504v48h-48"/>
	</g>
</svg>
